<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>AILP Management | メンテナンス中</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      color: #172033;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
    }
    main {
      width: min(560px, calc(100% - 40px));
      padding: 40px;
      background: #fff;
      border: 1px solid #dce3ef;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      line-height: 1.3;
    }
    p {
      margin: 0;
      color: #5f6b7a;
      font-size: 16px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <main>
    <h1>AILP Management</h1>
    <p>メンテナンス中です。</p>
  </main>
</body>
</html>
